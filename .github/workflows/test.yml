name: Run Tests

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - objects
          - network_services
          - security_services
          - identity_services
          - deployment_services
          - config_setup
          - config_operations

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov

      - name: Run tests for ${{ matrix.service }}
        env:
          SCM_CLIENT_ID: ${{ secrets.SCM_CLIENT_ID }}
          SCM_CLIENT_SECRET: ${{ secrets.SCM_CLIENT_SECRET }}
          SCM_SCOPE: ${{ secrets.SCM_SCOPE }}
          SCM_TSG_ID: ${{ secrets.SCM_TSG_ID }}
          SCM_HOST: ${{ secrets.SCM_HOST }}
          SCM_AUTH_URL: ${{ secrets.SCM_AUTH_URL }}
          PYTHONWARNINGS: ignore
          SCM_LOGGING: quiet
        run: |
          set +e
          if [ "${{ matrix.service }}" = "network_services" ]; then
            output=$(pytest -q --tb=short --disable-warnings --log-level=ERROR scm/${{ matrix.service }}/tests/ --ignore=scm/${{ matrix.service }}/tests/api_logical_routers_test.py 2>&1)
          elif [ "${{ matrix.service }}" = "objects" ]; then
            output=$(pytest -q --tb=short --disable-warnings --log-level=ERROR scm/${{ matrix.service }}/tests/ -k "not test_applications_list" 2>&1)
          else
            output=$(pytest -q --tb=short --disable-warnings --log-level=ERROR scm/${{ matrix.service }}/tests/ 2>&1)
          fi
          exit_code=$?

          if [ $exit_code -ne 0 ]; then
            echo "❌ Tests failed for ${{ matrix.service }}"
            echo "$output"
            exit $exit_code
          else
            echo "✅ All tests passed for ${{ matrix.service }}"
          fi
        timeout-minutes: 30
