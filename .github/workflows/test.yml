name: Run Tests

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - objects
          - network_services
          - security_services
          - identity_services
          - deployment_services
          - config_setup
          - config_operations

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov

      - name: Run tests for ${{ matrix.service }}
        env:
          SCM_CLIENT_ID: ${{ secrets.SCM_CLIENT_ID }}
          SCM_CLIENT_SECRET: ${{ secrets.SCM_CLIENT_SECRET }}
          SCM_SCOPE: ${{ secrets.SCM_SCOPE }}
          SCM_TSG_ID: ${{ secrets.SCM_TSG_ID }}
          SCM_HOST: ${{ secrets.SCM_HOST }}
          SCM_AUTH_URL: ${{ secrets.SCM_AUTH_URL }}
        run: |
          if [ "${{ matrix.service }}" = "network_services" ]; then
            pytest -v -rs scm/${{ matrix.service }}/tests/ --ignore=scm/${{ matrix.service }}/tests/api_logical_routers_test.py
          elif [ "${{ matrix.service }}" = "objects" ]; then
            pytest -v -rs scm/${{ matrix.service }}/tests/ -k "not test_applications_list"
          else
            pytest -v -rs scm/${{ matrix.service }}/tests/
          fi
        timeout-minutes: 30

      - name: Print skip reasons
        if: always()
        run: |
          echo "==================================="
          echo "Summary of skipped tests (if any):"
          echo "==================================="
          echo "If tests were skipped, the reason should be shown above."
          echo "Common reasons:"
          echo "  - Missing environment variables (SCM_CLIENT_ID, SCM_CLIENT_SECRET, SCM_TSG_ID)"
          echo "  - Client initialization failure (auth error)"
          echo "  - Network connectivity issues"

      - name: Test Summary
        if: always()
        run: |
          echo "## Test Results for ${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY
          echo "Tests completed with exit code: $?" >> $GITHUB_STEP_SUMMARY
